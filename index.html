<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nocturne — Deck Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0e0f0c;
    --bg-vignette: radial-gradient(120% 100% at 50% -10%, #1c1d18 0%, #0e0f0c 55%);
    --panel: linear-gradient(160deg, #1e1f1a 0%, #17180f 55%, #131410 100%);
    --panel-light: #262720;
    --panel-line: #33342b;
    --amber: #e8a33d;
    --amber-dim: #8a6224;
    --red: #d6584a;
    --green: #78c98e;
    --text: #f2ede1;
    --text-dim: #9a988a;
    --text-faint: #5f5d51;
    --radius-lg: 22px;
    --radius-md: 12px;
    --shadow-deep: 0 30px 60px -20px rgba(0,0,0,0.7), 0 10px 20px -10px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{height:100%;}

  body{
    background: var(--bg);
    background-image: var(--bg-vignette);
    color: var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
    -webkit-font-smoothing: antialiased;
  }

  .mono{ font-family:'JetBrains Mono', monospace; }

  .stage{
    width:100%;
    max-width: 1080px;
    display:grid;
    grid-template-columns: 1.55fr 1fr;
    gap: 20px;
  }

  /* ============ DECK ============ */
  .deck{
    background: var(--panel);
    border-radius: var(--radius-lg);
    border: 1px solid var(--panel-line);
    box-shadow: var(--shadow-deep), inset 0 1px 0 rgba(255,255,255,0.03);
    padding: 28px;
    display:grid;
    grid-template-columns: 240px 1fr;
    gap: 30px;
    position:relative;
    overflow:hidden;
  }
  .deck::before{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }

  /* ---- Platter / vinyl ---- */
  .deck-left{ display:flex; align-items:flex-start; justify-content:center; position:relative; }

  .platter{
    position:relative;
    width: 230px; height: 230px;
    margin-top: 6px;
  }

  .record{
    width:100%; height:100%;
    border-radius:50%;
    background:
      repeating-radial-gradient(circle at center,
        #0c0c0a 0px, #0c0c0a 2px,
        #17170f 3px, #17170f 4px);
    box-shadow: 0 12px 30px -8px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.04);
    display:flex; align-items:center; justify-content:center;
    animation: spin 9s linear infinite;
    animation-play-state: paused;
  }
  .record.spinning{ animation-play-state: running; }

  @keyframes spin{ to{ transform: rotate(360deg); } }

  .record-label{
    width: 42%; height:42%;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.5), inset 0 2px 6px rgba(0,0,0,0.35);
    transition: background 0.5s ease;
    position:relative;
  }
  .record-label::after{
    content:"";
    position:absolute;
    width:8px; height:8px;
    border-radius:50%;
    background:#0e0f0c;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.6);
  }
  .label-title{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:700;
    font-size:10px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color: rgba(0,0,0,0.55);
    padding: 0 10%;
    line-height:1.15;
  }

  .tonearm{
    position:absolute;
    top: -14px; right: -6px;
    width: 12px; height: 130px;
    transform-origin: top center;
    transform: rotate(-22deg);
    transition: transform 0.6s cubic-bezier(.4,1.4,.4,1);
    z-index:3;
  }
  .tonearm.active{ transform: rotate(6deg); }
  .tonearm::before{ /* pivot base */
    content:"";
    position:absolute; top:-10px; left:50%;
    transform: translateX(-50%);
    width: 26px; height:26px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #4a4a3f, #1a1a14 70%);
    box-shadow: 0 3px 6px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.08);
  }
  .tonearm::after{ /* arm shaft + head */
    content:"";
    position:absolute; top:8px; left:50%;
    transform: translateX(-50%);
    width:4px; height:112px;
    border-radius: 3px;
    background: linear-gradient(180deg,#5a5a4d,#26261f 85%);
    box-shadow: 6px 100px 0 -94px var(--amber);
  }

  /* ---- Track meta + controls ---- */
  .deck-right{ display:flex; flex-direction:column; justify-content:center; min-width:0; }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--text-faint);
    display:flex; align-items:center; gap:8px;
    margin-bottom:10px;
  }
  .led-dot{
    width:7px; height:7px;
    border-radius:50%;
    background: var(--text-faint);
    box-shadow: 0 0 0 rgba(120,201,142,0);
    transition: all 0.3s ease;
  }
  .led-dot.on{
    background: var(--green);
    box-shadow: 0 0 8px 1px rgba(120,201,142,0.7);
  }

  #trackTitle{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight: 800;
    font-size: clamp(28px, 4vw, 42px);
    line-height: 1;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #trackArtist{
    color: var(--text-dim);
    font-size: 15px;
    margin-top: 6px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* ---- Progress ---- */
  .progress-row{
    display:flex; align-items:center; gap:12px;
    margin-top: 26px;
  }
  .time{ font-size:12px; color: var(--text-dim); width:38px; flex-shrink:0; }
  #durTime{ text-align:right; }

  .progress-track{
    position:relative;
    flex:1;
    height: 10px;
    border-radius: 5px;
    background: #101109;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.03);
    overflow:hidden;
  }
  .progress-fill{
    position:absolute; top:0; left:0; height:100%;
    width:0%;
    background: linear-gradient(90deg, var(--amber-dim), var(--amber));
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.35) 0px, rgba(0,0,0,0.35) 2px, transparent 2px, transparent 6px),
      linear-gradient(90deg, var(--amber-dim), var(--amber));
    transition: width 0.08s linear;
  }
  #seek{
    position:absolute; inset:0;
    width:100%; height:100%;
    opacity:0;
    cursor:pointer;
    margin:0;
  }

  /* ---- Controls ---- */
  .controls-row{
    display:flex; align-items:center; justify-content:center;
    gap: 18px;
    margin-top: 24px;
  }
  button{
    font-family:inherit;
    border:none;
    background:none;
    color: var(--text-dim);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: color 0.15s ease, transform 0.1s ease;
  }
  button:hover{ color: var(--text); }
  button:active{ transform: scale(0.92); }
  button.toggled{ color: var(--amber); }

  .icon-btn{ width:36px; height:36px; }
  .icon-btn svg{ width:19px; height:19px; }

  .play-btn{
    width: 58px; height:58px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #f0b458, var(--amber) 60%, var(--amber-dim) 100%);
    color:#1a1305;
    box-shadow: 0 8px 18px -6px rgba(232,163,61,0.55), inset 0 1px 1px rgba(255,255,255,0.4);
  }
  .play-btn:hover{ color:#1a1305; filter:brightness(1.08); }
  .play-btn svg{ width:22px; height:22px; }

  .secondary-row{
    display:flex; align-items:center; justify-content:space-between;
    gap: 16px;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--panel-line);
  }

  .volume-wrap{ display:flex; align-items:center; gap:10px; flex:1; max-width:150px; }
  input[type="range"]#volume{
    -webkit-appearance:none; appearance:none;
    width:100%; height:4px;
    border-radius:2px;
    background: var(--panel-light);
    outline:none;
  }
  input[type="range"]#volume::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:12px; height:12px;
    border-radius:50%;
    background: var(--amber);
    box-shadow: 0 0 0 3px rgba(232,163,61,0.15);
    cursor:pointer;
    margin-top:-4px;
  }
  input[type="range"]#volume::-moz-range-thumb{
    width:12px; height:12px; border:none; border-radius:50%;
    background: var(--amber); cursor:pointer;
  }
  input[type="range"]#volume::-webkit-slider-runnable-track{ height:4px; border-radius:2px; }

  .upload-btn{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing:0.05em;
    color: var(--text-faint);
    border: 1px dashed var(--panel-line);
    padding: 8px 12px;
    border-radius: 8px;
    cursor:pointer;
    white-space:nowrap;
    transition: all 0.15s ease;
  }
  .upload-btn:hover{ color: var(--amber); border-color: var(--amber-dim); }

  /* ============ PLAYLIST ============ */
  .playlist-panel{
    background: var(--panel);
    border-radius: var(--radius-lg);
    border: 1px solid var(--panel-line);
    box-shadow: var(--shadow-deep);
    padding: 22px 0 10px;
    display:flex; flex-direction:column;
    min-height: 0;
    max-height: 100%;
  }
  .playlist-header{
    display:flex; align-items:baseline; justify-content:space-between;
    padding: 0 22px 16px;
    border-bottom: 1px solid var(--panel-line);
  }
  .playlist-header h2{
    font-family:'Big Shoulders Display', sans-serif;
    font-size: 20px;
    letter-spacing: 0.08em;
    font-weight:700;
  }
  #trackCount{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--text-faint); }

  #playlist{
    list-style:none;
    overflow-y:auto;
    max-height: 420px;
    padding: 6px 10px;
  }
  #playlist::-webkit-scrollbar{ width:6px; }
  #playlist::-webkit-scrollbar-thumb{ background: var(--panel-light); border-radius:3px; }

  .track-row{
    display:flex; align-items:center; gap:12px;
    padding: 10px 12px;
    border-radius: 9px;
    cursor:pointer;
    border-left: 2px solid transparent;
    transition: background 0.15s ease;
  }
  .track-row:hover{ background: rgba(255,255,255,0.03); }
  .track-row.active{
    background: rgba(232,163,61,0.08);
    border-left: 2px solid var(--amber);
  }
  .track-num{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color: var(--text-faint);
    width: 20px; flex-shrink:0;
  }
  .track-row.active .track-num{ color: var(--amber); }
  .track-swatch{
    width:34px; height:34px; border-radius:6px; flex-shrink:0;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
  }
  .track-info{ flex:1; min-width:0; }
  .track-info .t-title{
    font-size: 13.5px; font-weight:600; color:var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .track-info .t-artist{
    font-size: 11.5px; color: var(--text-faint);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .track-dur{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--text-faint); flex-shrink:0; }
  .fav-toggle{ width:26px; height:26px; flex-shrink:0; color: var(--text-faint); }
  .fav-toggle svg{ width:14px; height:14px; }
  .fav-toggle.active{ color: var(--red); }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 860px){
    .stage{ grid-template-columns: 1fr; }
    .deck{ grid-template-columns: 1fr; }
    .deck-left{ justify-content:center; }
    .platter{ width:190px; height:190px; }
    .secondary-row{ flex-wrap:wrap; }
    .upload-btn{ order:3; width:100%; text-align:center; margin-top:8px; }
  }
  @media (max-width: 460px){
    body{ padding:16px 10px; }
    .deck{ padding:20px 16px; }
    .controls-row{ gap:12px; }
    .play-btn{ width:52px; height:52px; }
  }
</style>
</head>
<body>

<div class="stage">

  <div class="deck">
    <div class="deck-left">
      <div class="platter">
        <div class="tonearm" id="tonearm"></div>
        <div class="record" id="record">
          <div class="record-label" id="recordLabel">
            <span class="label-title" id="labelTitle">—</span>
          </div>
        </div>
      </div>
    </div>

    <div class="deck-right">
      <p class="eyebrow">NOW PLAYING <span class="led-dot" id="ledDot"></span></p>
      <h1 id="trackTitle">—</h1>
      <p id="trackArtist">—</p>

      <div class="progress-row">
        <span class="time mono" id="curTime">0:00</span>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
          <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
        </div>
        <span class="time mono" id="durTime">0:00</span>
      </div>

      <div class="controls-row">
        <button class="icon-btn" id="shuffleBtn" title="Shuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
        </button>
        <button class="icon-btn" id="prevBtn" title="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM10 12l9-6v12z"></path></svg>
        </button>
        <button class="play-btn" id="playBtn" title="Play/Pause">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
        </button>
        <button class="icon-btn" id="nextBtn" title="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM5 6l9 6-9 6z"></path></svg>
        </button>
        <button class="icon-btn" id="repeatBtn" title="Repeat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
        </button>
      </div>

      <div class="secondary-row">
        <button class="icon-btn" id="favBtn" title="Favorite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"></path></svg>
        </button>

        <div class="volume-wrap">
          <button class="icon-btn" id="muteBtn" title="Mute">
            <svg id="volIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M5 9v6h4l5 5V4L9 9H5z"></path></svg>
          </button>
          <input type="range" id="volume" min="0" max="100" value="80" aria-label="Volume">
        </div>

        <label class="upload-btn" for="fileInput">+ LOAD FILES</label>
        <input type="file" id="fileInput" accept="audio/*" multiple hidden>
      </div>
    </div>
  </div>

  <aside class="playlist-panel">
    <div class="playlist-header">
      <h2>TRACKLIST</h2>
      <span id="trackCount" class="mono">00 / 00</span>
    </div>
    <ul id="playlist"></ul>
  </aside>

</div>

<audio id="audio" preload="metadata"></audio>

<script>
(function(){
  "use strict";

  // ---------- Data ----------
  const palettes = [
    ['#f0b458','#c97a2e'], ['#e8896a','#b34a3a'], ['#7fbfa0','#3f7a5f'],
    ['#8fa8d6','#4a5e8f'], ['#d6a5d9','#8a5a90'], ['#e0c96a','#a68a2e']
  ];

  const tracks = [
    { title:"Nocturne Radio", artist:"Midnight Frequency", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", fav:false, dur:0 },
    { title:"Cassette Bloom", artist:"Analog Drift", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", fav:false, dur:0 },
    { title:"Static & Amber", artist:"Low Fidelity Society", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", fav:false, dur:0 },
    { title:"Second Floor Lounge", artist:"Vinyl Room", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3", fav:false, dur:0 },
    { title:"Slow Dial", artist:"Copper Wire", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3", fav:false, dur:0 },
    { title:"After Hours Static", artist:"Nocturne Radio", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3", fav:false, dur:0 }
  ];

  // ---------- State ----------
  let current = 0;
  let isPlaying = false;
  let isShuffle = false;
  let repeatMode = 0; // 0 off, 1 all, 2 one
  let isMuted = false;
  let lastVolume = 80;
  let history = [];

  // ---------- Elements ----------
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  const favBtn = document.getElementById('favBtn');
  const muteBtn = document.getElementById('muteBtn');
  const volIcon = document.getElementById('volIcon');
  const volumeInput = document.getElementById('volume');
  const seek = document.getElementById('seek');
  const progressFill = document.getElementById('progressFill');
  const curTimeEl = document.getElementById('curTime');
  const durTimeEl = document.getElementById('durTime');
  const trackTitleEl = document.getElementById('trackTitle');
  const trackArtistEl = document.getElementById('trackArtist');
  const labelTitleEl = document.getElementById('labelTitle');
  const recordLabelEl = document.getElementById('recordLabel');
  const recordEl = document.getElementById('record');
  const tonearmEl = document.getElementById('tonearm');
  const ledDot = document.getElementById('ledDot');
  const playlistEl = document.getElementById('playlist');
  const trackCountEl = document.getElementById('trackCount');
  const fileInput = document.getElementById('fileInput');

  // ---------- Helpers ----------
  function fmtTime(s){
    if(!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2,'0');
    return `${m}:${sec}`;
  }

  function paletteFor(i){ return palettes[i % palettes.length]; }

  function renderPlaylist(){
    playlistEl.innerHTML = '';
    tracks.forEach((t, i) => {
      const [c1,c2] = paletteFor(i);
      const li = document.createElement('li');
      li.className = 'track-row' + (i === current ? ' active' : '');
      li.innerHTML = `
        <span class="track-num mono">${String(i+1).padStart(2,'0')}</span>
        <span class="track-swatch" style="background:linear-gradient(135deg, ${c1}, ${c2})"></span>
        <span class="track-info">
          <span class="t-title">${escapeHtml(t.title)}</span>
          <span class="t-artist">${escapeHtml(t.artist)}</span>
        </span>
        <span class="track-dur mono">${t.dur ? fmtTime(t.dur) : '--:--'}</span>
        <button class="fav-toggle${t.fav ? ' active' : ''}" data-idx="${i}" title="Favorite">
          <svg viewBox="0 0 24 24" fill="${t.fav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"></path></svg>
        </button>
      `;
      li.addEventListener('click', (e) => {
        if(e.target.closest('.fav-toggle')) return;
        loadTrack(i, true);
      });
      li.querySelector('.fav-toggle').addEventListener('click', (e) => {
        e.stopPropagation();
        t.fav = !t.fav;
        renderPlaylist();
        if(i === current) updateFavButton();
      });
      playlistEl.appendChild(li);
    });
    trackCountEl.textContent = `${String(current+1).padStart(2,'0')} / ${String(tracks.length).padStart(2,'0')}`;
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function updateFavButton(){
    const on = tracks[current].fav;
    favBtn.classList.toggle('toggled', on);
    favBtn.querySelector('svg').setAttribute('fill', on ? 'currentColor' : 'none');
    favBtn.style.color = on ? 'var(--red)' : '';
  }

  function loadTrack(index, autoplay){
    current = index;
    const t = tracks[current];
    audio.src = t.src;
    trackTitleEl.textContent = t.title;
    trackArtistEl.textContent = t.artist;
    labelTitleEl.textContent = t.title;
    const [c1,c2] = paletteFor(current);
    recordLabelEl.style.background = `radial-gradient(circle at 35% 30%, ${c1}, ${c2} 75%)`;
    updateFavButton();
    renderPlaylist();
    seek.value = 0;
    progressFill.style.width = '0%';
    curTimeEl.textContent = '0:00';
    durTimeEl.textContent = t.dur ? fmtTime(t.dur) : '0:00';
    history.push(current);
    if(autoplay !== false){
      play();
    } else {
      pause();
    }
  }

  function play(){
    audio.play().catch(()=>{ /* autoplay may be blocked until user interacts */ });
    isPlaying = true;
    playIcon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"></path>';
    recordEl.classList.add('spinning');
    tonearmEl.classList.add('active');
    ledDot.classList.add('on');
  }

  function pause(){
    audio.pause();
    isPlaying = false;
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"></path>';
    recordEl.classList.remove('spinning');
    tonearmEl.classList.remove('active');
    ledDot.classList.remove('on');
  }

  function togglePlay(){ isPlaying ? pause() : play(); }

  function pickShuffleIndex(){
    if(tracks.length <= 1) return current;
    let idx;
    do { idx = Math.floor(Math.random() * tracks.length); } while(idx === current);
    return idx;
  }

  function goNext(userTriggered){
    if(repeatMode === 2 && !userTriggered){
      audio.currentTime = 0;
      play();
      return;
    }
    let nextIdx;
    if(isShuffle){
      nextIdx = pickShuffleIndex();
    } else {
      nextIdx = current + 1;
      if(nextIdx >= tracks.length){
        if(repeatMode === 1){ nextIdx = 0; }
        else { pause(); return; }
      }
    }
    loadTrack(nextIdx, true);
  }

  function goPrev(){
    if(audio.currentTime > 3){
      audio.currentTime = 0;
      return;
    }
    let prevIdx = isShuffle ? pickShuffleIndex() : (current - 1 + tracks.length) % tracks.length;
    loadTrack(prevIdx, true);
  }

  // ---------- Events ----------
  playBtn.addEventListener('click', togglePlay);
  nextBtn.addEventListener('click', () => goNext(true));
  prevBtn.addEventListener('click', goPrev);

  shuffleBtn.addEventListener('click', () => {
    isShuffle = !isShuffle;
    shuffleBtn.classList.toggle('toggled', isShuffle);
  });

  repeatBtn.addEventListener('click', () => {
    repeatMode = (repeatMode + 1) % 3;
    repeatBtn.classList.toggle('toggled', repeatMode !== 0);
    repeatBtn.style.color = repeatMode === 2 ? 'var(--amber)' : (repeatMode === 1 ? 'var(--amber)' : '');
    repeatBtn.title = repeatMode === 0 ? 'Repeat: off' : (repeatMode === 1 ? 'Repeat: all' : 'Repeat: one');
  });

  favBtn.addEventListener('click', () => {
    tracks[current].fav = !tracks[current].fav;
    updateFavButton();
    renderPlaylist();
  });

  audio.addEventListener('timeupdate', () => {
    if(!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = pct + '%';
    seek.value = pct;
    curTimeEl.textContent = fmtTime(audio.currentTime);
  });

  audio.addEventListener('loadedmetadata', () => {
    durTimeEl.textContent = fmtTime(audio.duration);
    tracks[current].dur = audio.duration;
    renderPlaylist();
  });

  audio.addEventListener('ended', () => goNext(false));

  seek.addEventListener('input', () => {
    if(!audio.duration) return;
    audio.currentTime = (seek.value / 100) * audio.duration;
    progressFill.style.width = seek.value + '%';
  });

  volumeInput.addEventListener('input', () => {
    const v = Number(volumeInput.value);
    audio.volume = v / 100;
    isMuted = v === 0;
    lastVolume = v || lastVolume;
    updateVolIcon();
  });

  muteBtn.addEventListener('click', () => {
    isMuted = !isMuted;
    if(isMuted){
      lastVolume = Number(volumeInput.value) || lastVolume;
      audio.volume = 0;
      volumeInput.value = 0;
    } else {
      audio.volume = (lastVolume || 80) / 100;
      volumeInput.value = lastVolume || 80;
    }
    updateVolIcon();
  });

  function updateVolIcon(){
    const v = Number(volumeInput.value);
    let path;
    if(v === 0){
      path = '<path d="M16.5 12L20 15.5l-1.4 1.4L15 13.4l-3.5 3.5L10 15.5 13.6 12 10 8.5 11.5 7 15 10.6 18.5 7 20 8.5z"></path>';
    } else if(v < 50){
      path = '<path d="M5 9v6h4l5 5V4L9 9H5zM16.5 12a3.5 3.5 0 0 0-2-3.16v6.32A3.5 3.5 0 0 0 16.5 12z"></path>';
    } else {
      path = '<path d="M5 9v6h4l5 5V4L9 9H5zM16.5 12a3.5 3.5 0 0 0-2-3.16v6.32A3.5 3.5 0 0 0 16.5 12zM19 12a6.98 6.98 0 0 0-4-6.32v1.9A5 5 0 0 1 17 12a5 5 0 0 1-2 4.42v1.9A6.98 6.98 0 0 0 19 12z"></path>';
    }
    volIcon.innerHTML = path;
  }

  // File upload — play local files
  fileInput.addEventListener('change', (e) => {
    const files = Array.from(e.target.files || []);
    if(!files.length) return;
    const startIdx = tracks.length;
    files.forEach((f) => {
      const url = URL.createObjectURL(f);
      const name = f.name.replace(/\.[^/.]+$/, '');
      tracks.push({ title: name, artist: "Local file", src: url, fav:false, dur:0 });
    });
    renderPlaylist();
    loadTrack(startIdx, true);
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if(e.target.tagName === 'INPUT') return;
    if(e.code === 'Space'){ e.preventDefault(); togglePlay(); }
    else if(e.code === 'ArrowRight'){ audio.currentTime = Math.min(audio.duration||0, audio.currentTime + 5); }
    else if(e.code === 'ArrowLeft'){ audio.currentTime = Math.max(0, audio.currentTime - 5); }
    else if(e.code === 'ArrowUp'){ e.preventDefault(); volumeInput.value = Math.min(100, Number(volumeInput.value)+5); volumeInput.dispatchEvent(new Event('input')); }
    else if(e.code === 'ArrowDown'){ e.preventDefault(); volumeInput.value = Math.max(0, Number(volumeInput.value)-5); volumeInput.dispatchEvent(new Event('input')); }
  });

  // ---------- Init ----------
  audio.volume = 0.8;
  renderPlaylist();
  loadTrack(0, false);
  updateVolIcon();

})();
</script>
</body>
</html>
